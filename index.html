<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#121211" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https:; media-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="manifest" href="/min-filmsamling/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/min-filmsamling/icons/apple-touch-icon.png" />
    <link rel="icon" href="/min-filmsamling/icons/icon-192.png" />
    <title>Min filmsamling</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
            focusable="false"
          >
            <path d="M4 3h16v18H4zM4 7h16M4 17h16M8 3v18M16 3v18" />
          </svg>
        </span>
        <div>
          <h1>Min filmsamling</h1>
          <p>DVD · Blu-ray · 4K</p>
        </div>
      </div>
      <span id="network">Lokalt gemt</span>
    </header>
    <div id="update" hidden>
      <p>En ny version er klar.</p>
      <button id="install-update">Opdatér appen</button>
    </div>
    <p id="status" role="status" aria-live="polite">Åbner din samling…</p>
    <section id="fatal" role="alert" hidden>
      <h2>Appen kunne ikke starte</h2>
      <p>
        Din samling er stadig gemt på enheden. Kontrollér forbindelsen, og genindlæs appen. Hvis
        fejlen fortsætter, kontakt den ansvarlige for appen.
      </p>
      <a href="/min-filmsamling/">Prøv igen</a>
    </section>
    <main id="app"><p>Indlæser film og kladder…</p></main>
    <nav aria-label="Hovedmenu">
      <button data-view="library">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M4 3h16v18H4zM4 7h16M4 17h16M8 3v18M16 3v18" />
        </svg>
        <span>Film</span>
      </button>
      <button data-view="form">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>Tilføj</span>
      </button>
      <button data-view="settings">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6" />
        </svg>
        <span>Indstillinger</span>
      </button>
    </nav>
    <div id="modal"></div>
    <noscript
      ><p>
        Appen kræver JavaScript. Aktivér JavaScript i Safari for at åbne din samling.
      </p></noscript
    >
    <script src="/min-filmsamling/boot.js"></script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
